<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIST 30 Veri Çekme Denemesi</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 2rem 1rem 3rem;
      background: #f5f7fb;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw + 1rem, 2.25rem);
      text-align: center;
    }

    p {
      margin: 0;
      max-width: 720px;
      text-align: center;
      line-height: 1.6;
      color: #334155;
    }

    button {
      background: linear-gradient(135deg, #0369a1, #38bdf8);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(14, 165, 233, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 18px 38px rgba(14, 165, 233, 0.4);
    }

    button:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.25);
    }

    .status {
      min-height: 1.5rem;
      font-size: 1rem;
      color: #0f172a;
      text-align: center;
    }

    pre {
      width: min(960px, 100%);
      background: #0f172a;
      color: #f8fafc;
      padding: 1.25rem;
      border-radius: 16px;
      overflow-x: auto;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.25);
      min-height: 320px;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    code {
      font-family: "Fira Code", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>
<body>
  <h1>BIST 30 Veri Çekme Denemesi</h1>
  <p>
    Aşağıdaki butona basarak Yahoo Finance API'sinden BIST 30 hisselerinin ham yanıtını çekebilir
    ve çıktıyı inceleyebilirsiniz. Önce veri alma adımının sorunsuz çalıştığını teyit edeceğiz; tablo
    vb. görselleştirme daha sonra eklenecek.
  </p>
  <button id="fetchBtn" type="button">Verileri Çek</button>
  <div class="status" id="status">Hazır</div>
  <pre><code id="output">Henüz bir istek yapılmadı.</code></pre>

  <script>
    const tickerList = [
      "AEFES.IS", "AKBNK.IS", "AKSEN.IS", "ARCLK.IS", "ASELS.IS",
      "BIMAS.IS", "BRSAN.IS", "DOAS.IS", "EKGYO.IS", "ENKAI.IS",
      "EREGL.IS", "FROTO.IS", "GARAN.IS", "GUBRF.IS", "HALKB.IS",
      "HEKTS.IS", "ISCTR.IS", "KCHOL.IS", "KOZAA.IS", "KOZAL.IS",
      "KRDMD.IS", "MGROS.IS", "PGSUS.IS", "SAHOL.IS", "SISE.IS",
      "TCELL.IS", "THYAO.IS", "TTKOM.IS", "TUPRS.IS", "YKBNK.IS"
    ];

    const statusElement = document.getElementById("status");
    const outputElement = document.getElementById("output");

    function createQuoteUrl(symbols) {
      const params = new URLSearchParams({
        lang: "tr-TR",
        region: "TR",
        symbols: symbols.join(",")
      });
      return `https://query1.finance.yahoo.com/v7/finance/quote?${params.toString()}`;
    }

    async function fetchYahooQuotes(symbols) {
      const url = createQuoteUrl(symbols);
      const response = await fetch(url, {
        headers: {
          "Accept": "application/json, text/javascript, */*; q=0.01"
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      return response.json();
    }

    async function handleFetch() {
      statusElement.textContent = "Veriler çekiliyor...";
      statusElement.style.color = "#0f172a";
      outputElement.textContent = "İstek gönderildi, yanıt bekleniyor...";

      try {
        const rawPayload = await fetchYahooQuotes(tickerList);
        const quotes = rawPayload?.quoteResponse?.result ?? [];
        const prettified = JSON.stringify({
          kaynak: "query1.finance.yahoo.com",
          sembolSayisi: tickerList.length,
          bulunanKayit: quotes.length,
          ornek: quotes.slice(0, 2)
        }, null, 2);

        outputElement.textContent = prettified;
        statusElement.textContent = "Veriler başarıyla alındı.";
        statusElement.style.color = "#16a34a";
      } catch (error) {
        console.error("Veri çekme denemesi başarısız", error);
        statusElement.textContent = `Hata: ${error.message}`;
        statusElement.style.color = "#dc2626";
        outputElement.textContent = [
          "İstek başarısız oldu.",
          "Tarayıcı geliştirici araçlarındaki ağ sekmesinden (Network tab)",
          "gelen cevabı ve varsa CORS kısıtlarını inceleyebilirsiniz.",
          "", `Hata mesajı: ${error.message}`
        ].join("\n");
      }
    }

    document.getElementById("fetchBtn").addEventListener("click", handleFetch);
  </script>
</body>
</html>
